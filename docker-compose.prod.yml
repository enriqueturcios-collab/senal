services:

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  api:
    build: ./api
    restart: always
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV:             production
      PORT:                 3001
      DATABASE_URL:         postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      API_VERSION:          v1
      CORS_ORIGINS:         ${CORS_ORIGINS}
      ARGON2_TIME_COST:     ${ARGON2_TIME_COST:-3}
      ARGON2_MEMORY_COST:   ${ARGON2_MEMORY_COST:-65536}
      RATE_LIMIT_MAX:       ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
    networks: [internal, web]

  portal:
    build: ./portal
    restart: always
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL:    postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NEXTAUTH_URL:    ${PORTAL_URL}
      NEXTAUTH_SECRET: ${PORTAL_NEXTAUTH_SECRET}
    networks: [internal, web]

  app:
    build: ./app
    restart: always
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL:    postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NEXTAUTH_URL:    ${APP_URL}
      NEXTAUTH_SECRET: ${APP_NEXTAUTH_SECRET}
    networks: [internal, web]

  etl:
    build: ./etl
    restart: always
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL:               postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      K_ANONYMITY_THRESHOLD:      ${K_ANONYMITY_THRESHOLD:-5}
      ETL_BATCH_SIZE:             ${ETL_BATCH_SIZE:-1000}
      ETL_INCREMENTAL_LOOKBACK_H: ${ETL_INCREMENTAL_LOOKBACK_H:-2}
      DRY_RUN:                    "false"
      LOG_LEVEL:                  ${LOG_LEVEL:-INFO}
      LOG_FORMAT:                 json
    networks: [internal]

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on: [api, portal, app]
    networks: [web]

networks:
  internal:
  web:

volumes:
  pgdata:
